<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cumparaturi</title>
</head>
<body>
<main>
      <aside class="side_nav">
            <nav class="nav_sid">
                <center>   
                    <h5 id="ora"></h5>
                </center>
            </nav>
        </aside>
    <div style="text-align: right; margin-bottom: 20px; padding: 20px;">
        <select id="tipStocare" onchange="schimbaStocarea()" style="padding: 10px; border-radius: 8px;">
            <option value="local">Web Storage (Local)</option>
            <option value="indexed">IndexedDB</option>
        </select>
        <button id="btn-cos" onclick="toggleCart()">Cos (<span id="cart-count">0</span>)</button>
    </div>

    <form id="shop"></form>

    <div id="popup-cos">
        <div class="popup-continut">
            <span class="inchide" onclick="toggleCart()">X</span>
            <h2>Cos de cumparaturi</h2>
            <table id="tabel-cos-produse">
                <tbody id="cart-body"></tbody>
            </table>
            <h3 id="cart-total">Total: 0 EUR</h3>
            <button id="btn-checkout" onclick="finalizeazaComanda()" style="background-color: #81d68e; color: white; border: none; padding: 12px 24px; font-size: 18px; border-radius: 20px; font-weight: bold; width: 100%; margin-top: 15px; cursor: pointer;">Go to Checkout</button>
        </div>
    </div>
</main>
</body>
</html>
