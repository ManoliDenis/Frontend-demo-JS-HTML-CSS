    <main>
        <center>
            <h1>Inregistrare</h1><br>
            <form>
                <center>Informatii generale </center>
                <label for="username">Nume utilizator:</label>
                <input type="text" id="username" name="username_box"><br>
                <label for="parola">Parola:</label>
                <input type="password" id="parola" name="password_box"><br>
                <label for="nume">Nume:</label>
                <input type="text" id="nume" name="name_box"><br>
                <label for="prenume">Prenume:</label>
                <input type="text" id="prenume" name="prenume_box"><br>
                <label for="email">Email:</label>
                <input type="text" id="email" name="email_box"><br>
                <label for="tel">Telefon:</label>
                <input type="text" id="tel" name="tel_box">
                <center>Informatii personale</center><br>
                <label for="sex">Sexul:</label>
                <select id="sex" name="sex">
                    <option value="masculin">Masculin</option>
                    <option value="feminin">Feminin</option>
                    <option value="neutru">Neutru</option>
                    <option value="imperialist">Imperialist</option>
                    <option value="lucis">Lucis</option>
                </select><br><br>
                <label for="favfood">Mancarea preferata</label>
                <input list="favfoods" name="favfood" id="favfood">
                <datalist id="favfoods" name="favfood_box">
                    <option value="Platou Persan">
                    <option value="Piatto Kebab">
                    <option value="Pita cu pateu">
                    <option value="John">
                </datalist><br>
                <label for="culoare">Culoare preferata:</label>
                <input type="color" id="culoare" name="culoare"><br>
                <label for="datanasterii">Data nasterii:</label>
                <input type="date" id="datanasterii" name="datanasterii"><br>
                <label for="oranasterii">Data nasterii:</label>
                <input type="time" id="oranasterii" name="oranasterii"><br>
                <label for="varsta">Varsta:</label>
                <input type="range" id="varsta" name="varsta"><br>
                <label for="adresapagina">Adresa paginii personale:</label>
                <input type="url" id="adresapagina" name="adresapagina"><br> 
                <label for="descriere">Desriere situatie:</label>
                <textarea></textarea><br>
                <button type="submit" disabled="true">Inregistreaza</button>
                
            </form>
        </center>
