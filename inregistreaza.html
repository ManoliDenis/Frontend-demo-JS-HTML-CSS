    <main>
        <aside class="side_nav">
            <nav class="nav_sid">
                <center>
                    <a href="#inregistrare">Inregistrare</a><br>
                    <h5 id="ora"></h5>
                </center>
            </nav>
        </aside>
       
        <section class="sectiune-register">
            <h1 id="inregistrare">Inregistrare</h1>
            
            <form class="formular-inregistrare">
                <h3>Informatii generale</h3>
                
                <label for="username">Nume utilizator:</label>
                <input type="text" id="username" name="username_box">
                
                <label for="parola">Parola:</label>
                <input type="password" id="parola" name="password_box">
                
                <label for="nume">Nume:</label>
                <input type="text" id="nume" name="name_box">
                
                <label for="prenume">Prenume:</label>
                <input type="text" id="prenume" name="prenume_box">
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email_box">
                
                <label for="tel">Telefon:</label>
                <input type="tel" id="tel" name="tel_box">
                
                <h3>Informatii personale</h3>
                
                <label for="sex">Sexul:</label>
                <select id="sex" name="sex">
                    <option value="masculin">Masculin</option>
                    <option value="feminin">Feminin</option>
                    <option value="neutru">Neutru</option>
                    <option value="imperialist">Imperialist</option>
                    <option value="lucis">Lucis</option>
                </select>
                
                <label for="favfood">Mancarea preferata:</label>
                <input list="favfoods" name="favfood" id="favfood">
                <datalist id="favfoods">
                    <option value="Platou Persan">
                    <option value="Piatto Kebab">
                    <option value="Pita cu pateu">
                    <option value="John">
                </datalist>
                
                <label for="culoare">Culoare preferata:</label>
                <input type="color" id="culoare" name="culoare">
                
                <label for="datanasterii">Data nasterii:</label>
                <input type="date" id="datanasterii" name="datanasterii">
                
                <label for="oranasterii">Ora nasterii:</label>
                <input type="time" id="oranasterii" name="oranasterii">
                
                <label for="varsta">Varsta:</label>
                <input type="range" id="varsta" name="varsta">
                
                <label for="adresapagina">Adresa paginii personale:</label>
                <input type="url" id="adresapagina" name="adresapagina">
                
                <label for="descriere">Descriere situatie:</label>
                <textarea id="descriere" name="descriere"></textarea>
                
                <button type="submit" disabled="true" class="btn-submit">Inregistreaza</button>
            </form>
        </section>
  
    </main>

    <footer  class="bara-jos">
